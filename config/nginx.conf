worker_processes 1;
events { worker_connections 1024; }

http {
    # Zona de Rate Limit (10 requisições por segundo por IP)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    client_max_body_size 50m;

    server {
        limit_req zone=mylimit burst=100 nodelay;
        limit_req_status 429;
        listen 8080;
        server_name osachadinhosdashopee.com.br localhost;
        absolute_redirect off;
        port_in_redirect off;

        # 🌐 RAIZ GLOBAL E ARQUIVOS ESTÁTICOS (Onde os 17 mil HTMLs vão morar)
        
        # 🌐 ARQUIVOS ESTÁTICOS OTIMIZADOS (Banners locais)
        location /assets/ {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            expires 365d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            try_files $uri $uri/ =404;
        }

        # 🛒 LOJA NA RAIZ
        location = / {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            try_files /recomende.html =404;
        }

        # 📄 PÁGINA DE PRODUTO
        location = /post.html {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            try_files /produto.html =404;
        }

        # 📊 PAINEL ADMIN (Liberado e sem bloqueios)
        location = /admin {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            try_files /admin.html =404;
        }

        # 📋 CHECKLIST E RELATÓRIOS
        location = /checklist {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            try_files /checklist.html =404;
        }
        location = /relatorios {
            root /data/data/com.termux/files/home/centro-comando-unificado/frontend;
            try_files /relatorios.html =404;
        }

        # 📜 PÁGINAS LEGAIS
        location = /termos.html { root /data/data/com.termux/files/home/centro-comando-unificado/frontend; }
        location = /privacidade.html { root /data/data/com.termux/files/home/centro-comando-unificado/frontend; }
        location = /cookies.html { root /data/data/com.termux/files/home/centro-comando-unificado/frontend; }
        location = /sitemap.xml { root /data/data/com.termux/files/home/centro-comando-unificado/frontend; }
        location = /login.html { root /data/data/com.termux/files/home/centro-comando-unificado/frontend; }
        location = /robots.txt { root /data/data/com.termux/files/home/centro-comando-unificado/frontend; }

        # ⚙️ API DO BACKEND
        
        location = /api/admin/stats {
            proxy_pass http://127.0.0.1:3001/api/admin/stats;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $http_cookie;
        }

        # 🎬 OPENSHORTS FRONTEND
        location = /shorts {
            return 301 /shorts/;
        }
        location /shorts/ {
            alias /data/data/com.termux/files/home/openshorts/frontend/dist/;
            try_files $uri $uri/ /shorts/index.html;
        }

        # 🎬 OPENSHORTS API
        location /shorts-api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # 🧠 LLM (Cliproxy)
        location /v1/ {
            proxy_pass http://127.0.0.1:8317/v1/;
            proxy_set_header Host $host;
        }

        
        # Cabeçalhos de Segurança (AppSec)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location @error401 {
            return 302 /login.html;
        }
    }
}
